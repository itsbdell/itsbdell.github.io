<header class="site-header no-print">
  <h1 class="site-name">
    <a href="/">{{ site.title }}</a>
  </h1>
  <nav class="site-nav" aria-label="Primary">
    {% for item in site.data.navigation.links %}
    <a href="{{ item.url }}" {% if item.external %}target="_blank" rel="noopener noreferrer"{% endif %}>{{ item.title }}</a>
    {% endfor %}
  </nav>
</header>
