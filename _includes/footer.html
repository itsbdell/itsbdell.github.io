<footer class="site-footer no-print">
  <nav class="footer-links" aria-label="Footer">
    {% if site.social.twitter %}
    <a href="https://x.com/{{ site.social.twitter }}">X</a>
    {% endif %}
    {% if site.social.linkedin %}
    <a href="https://www.linkedin.com/in/{{ site.social.linkedin }}/">LinkedIn</a>
    {% endif %}
    <a href="mailto:{{ site.social.email }}">Email</a>
    <a href="{{ '/atom.xml' | relative_url }}">RSS</a>
    <a href="{{ '/apps.json' | relative_url }}">apps.json</a>
    <a href="{{ '/llms.txt' | relative_url }}">llms.txt</a>
  </nav>
</footer>
