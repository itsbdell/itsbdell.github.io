# Source of truth for /made.json and the /apps/ page.
# Edit this file; both the public feed and the rendered page rebuild from it.
# Spec: https://github.com/itsbdell/made-json

- id: made-json
  name: "made.json"
  kind: standard
  description: "A tiny open standard for publishing software, skills, tools, prompts, workflows, and agents."
  url: "https://made-json.org"
  tags: [standard, feed, open-web]
  vibe_coded: true
  forkable: true
  source: "https://github.com/itsbdell/made-json"
  targets:
    - kind: web
      url: "https://made-json.org"
      label: "Read the spec"
    - kind: web
      url: "https://github.com/itsbdell/made-json"
      label: "View on GitHub"

